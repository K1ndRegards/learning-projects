<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="./dist/output.css" />

    <!-- Fontawesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- Icon -->
    <link rel="shortcut icon" href="./assets/favicon.ico" type="image/x-icon" />

    <title>Tracalorie | Track your Calories</title>
  </head>
  <body class="text-dark">
    <!-- Templates -->
    <template id="list-item-template">
      <li class="list-item">
        <p class="list-item__name"></p>
        <div class="list-item__calories">
          <p class="list-item__calories-number"></p>
        </div>
        <button type="button" class="list-item__remove btn btn-danger">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </li>
    </template>

    <!-- Website header -->
    <header
      class="flex flex-col md:flex-row justify-center md:justify-between items-center py-2 md:py-4 px-12 bg-primary text-white"
    >
      <h1 class="text-3xl md:text-4xl mb-2 md:mb-0">
        <i class="fa-solid fa-utensils"></i>Tracalorie
      </h1>

      <div class="flex gap-4 justify-center items-center">
        <button type="button" class="open-modal btn" id="open-limit-modal">
          Set Daily Limit
        </button>
        <button type="button" class="btn" id="reset-button">Reset Day</button>
      </div>
    </header>

    <!-- Modal window -->
    <div
      class="absolute top-0 left-0 right-0 bottom-0 justify-center items-start pt-8 px-4 bg-black/60 hidden"
      id="limit-modal"
    >
      <div class="max-w-full w-125 rounded-lg bg-white" id="modal-content">
        <header class="flex justify-between p-4">
          <h2 class="text-xl">Set Daily Limit</h2>

          <button type="button" class="cursor-pointer" id="close-modal-btn">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </header>

        <div class="border border-gray-200"></div>

        <form class="flex flex-col space-y-4 p-4" id="calorie-limit-form">
          <div>
            <label for="calorie-limit-input" class="block mb-2"
              >Daily Calorie Limit</label
            >
            <input
              type="number"
              name="calorie-limit-input"
              class="input-field"
              id="calorie-limit-input"
            />
          </div>

          <button type="submit" class="btn btn-primary" id="save-limit-btn">
            Save
          </button>
        </form>
      </div>
    </div>

    <!-- Main page content -->
    <main class="px-4 md:px-12 py-16">
      <!-- Stats -->
      <section id="stats">
        <!-- Grid row-1 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
          <!-- Stats - daily calorie limit -->
          <div class="stats-cell bg-dark text-white">
            <p class="stats-number" id="stats-limit">0</p>
            <h2 class="stats-label">Daily Calorie Limit</h2>
          </div>

          <!-- Stats - gain/loss -->
          <div class="stats-cell bg-primary text-white">
            <p class="stats-number" id="stats-total">0</p>
            <h2 class="stats-label">Gain/Loss</h2>
          </div>
        </div>

        <!-- Grid row-2 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <!-- Stats - calories consumed -->
          <div class="stats-cell bg-light text-dark border border-gray-300">
            <p class="stats-number" id="stats-consumed">0</p>
            <h2 class="stats-label">Calories Consumed</h2>
          </div>

          <!-- Stats - calories burned -->
          <div class="stats-cell bg-light text-dark border border-gray-300">
            <p class="stats-number" id="stats-burned">0</p>
            <h2 class="stats-label">Calories Burned</h2>
          </div>

          <!-- Stats - calories remaining -->
          <div class="stats-cell bg-light text-dark border border-gray-300">
            <p class="stats-number" id="stats-remaining">0</p>
            <h2 class="stats-label">Calories Remaining</h2>
          </div>
        </div>
      </section>

      <!-- Progress bar -->
      <div class="mt-12 w-full h-4 bg-gray-200 rounded-xl overflow-hidden">
        <div
          class="w-0 h-full transition-all duration-600"
          id="progress-fill"
        ></div>
      </div>

      <!-- Filters -->
      <section class="mt-16" id="filters">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- Filter meals group -->
          <div>
            <label for="meal-filter" class="sr-only">Filter meals</label>
            <input
              type="text"
              name="meal-filter"
              class="input-field"
              id="meal-filter"
              placeholder="Filter Meals..."
            />
          </div>

          <!-- Filter workouts group -->
          <div>
            <label for="workout-filter" class="sr-only">Filter workouts</label>
            <input
              type="text"
              name="workout-filter"
              class="input-field shadow-on-focus"
              id="workout-filter"
              placeholder="Filter Workouts..."
            />
          </div>
        </div>
      </section>

      <!-- Items (Meals / Food Items and Workouts) -->
      <section class="mt-12">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- Meals / Food Items -->
          <div class="flex flex-col" id="meal-item-panel">
            <header class="flex justify-between items-center mb-2">
              <h2 class="text-2xl pl-2 py-2 border-l-3 border-primary">
                Meals / Food Items
              </h2>

              <button
                type="button"
                class="btn btn-primary"
                id="toggle-meal-form"
              >
                <i class="fa-solid fa-plus mr-1"></i>Add Meal
              </button>
            </header>

            <!-- Add meal form -->
            <div class="collapse-wrapper" id="meal-form-wrapper">
              <form
                class="p-4 space-y-4 border border-gray-300 rounded-lg bg-light"
                id="meal-form"
              >
                <!-- Meal item input field -->
                <div>
                  <label for="meal-name-input" class="sr-only"
                    >Enter meal name</label
                  >
                  <input
                    type="text"
                    name="meal-name-input"
                    class="input-field"
                    id="meal-name-input"
                    placeholder="Enter meal name"
                    maxlength="16"
                  />
                </div>

                <!-- Calorie intake input field -->
                <div>
                  <label for="meal-calorie-input" class="sr-only"
                    >Enter calories</label
                  >
                  <input
                    type="number"
                    name="meal-calorie-input"
                    class="input-field"
                    id="meal-calorie-input"
                    placeholder="Enter calories"
                  />
                </div>

                <button type="submit" class="btn btn-primary" id="add-meal-btn">
                  Add Meal Item
                </button>
              </form>
            </div>

            <ul class="flex flex-col space-y-2 mt-2" id="meal-item-list"></ul>
          </div>

          <!-- Workout Items -->
          <div class="flex flex-col mt-12 md:mt-0" id="workout-item-panel">
            <header class="flex justify-between items-center mb-2">
              <h2 class="text-2xl pl-2 py-2 border-l-3 border-secondary">
                Workouts
              </h2>

              <button
                type="button"
                class="btn btn-secondary"
                id="toggle-workout-form"
              >
                <i class="fa-solid fa-plus mr-1"></i>Add Workout
              </button>
            </header>

            <!-- Add workout form -->
            <div class="collapse-wrapper" id="workout-form-wrapper">
              <div class="collapse-inner">
                <form
                  class="p-4 space-y-4 border border-gray-300 rounded-lg bg-light"
                  id="workout-form"
                >
                  <!-- Workout item input field -->
                  <div>
                    <label for="workout-name-input" class="sr-only"
                      >Enter workout name</label
                    >
                    <input
                      type="text"
                      name="workout-name-input"
                      class="input-field"
                      id="workout-name-input"
                      placeholder="Enter workout name"
                      maxlength="16"
                    />
                  </div>

                  <!-- Calorie burned input field -->
                  <div>
                    <label for="workout-calorie-input" class="sr-only"
                      >Enter burned calories</label
                    >
                    <input
                      type="number"
                      name="workout-calorie-input"
                      class="input-field"
                      id="workout-calorie-input"
                      placeholder="Enter calories"
                    />
                  </div>

                  <button
                    type="submit"
                    class="btn btn-secondary"
                    id="add-workout-btn"
                  >
                    Add Workout Item
                  </button>
                </form>
              </div>
            </div>

            <ul
              class="flex flex-col space-y-2 mt-2"
              id="workout-item-list"
            ></ul>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="./src/js/app.js"></script>
  </body>
</html>

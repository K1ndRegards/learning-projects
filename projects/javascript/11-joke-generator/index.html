<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="./dist/output.css" />
    <title>Joke Generator</title>
  </head>
  <body class="bg-[#686de0] font-sans">
    <!-- Global container -->
    <main class="flex justify-center items-center min-h-screen px-6">
      <!-- Jokes generator -->
      <article
        class="flex flex-col items-center gap-12 w-full max-w-4xl min-h-96 p-12 rounded-xl shadow-xl shadow-black/20 bg-white"
      >
        <!-- Heading -->
        <h2 class="text-xl tracking-wider font-bold text-gray-400">
          Chuck Norris Jokes
        </h2>

        <!-- Status and joke container -->
        <div class="flex flex-col items-center w-full">
          <!-- Loading message -->
          <p class="text-3xl text-gray-500 hidden" id="status">
            Joke is on the way, stand by...
          </p>

          <!-- Joke field -->
          <p
            class="text-3xl text-center w-full wrap-break-word tracking-wide"
            id="joke"
          >
            Lorem ipsum dolor, sit amet consectetur adipisicing elit. Ipsam, in?
            Officia deserunt aspernatur aliquam maxime consectetur sint
            voluptate aliquid voluptatibus assumenda sit? Aut qui officia,
            quisquam aperiam voluptatum adipisci cumque.
          </p>
        </div>

        <!-- Get joke btn -->
        <button
          type="button"
          class="transition duration-200 mt-auto shadow-lg shadow-black/20 rounded-lg px-6 py-3 bg-[#9f68e0] cursor-pointer text-white hover:scale-105 active:scale-100"
          id="get-joke-btn"
        >
          Get Another Joke
        </button>
      </article>
    </main>

    <script src="./src/main.js"></script>
  </body>
</html>

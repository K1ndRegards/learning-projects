<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Fontawesome -->
    <script
      src="https://kit.fontawesome.com/ee80a239bd.js"
      crossorigin="anonymous"
    ></script>
    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="./dist/output.css" />
    <title>Login Modal</title>
  </head>
  <body class="bg-rose-50 font-sans">
    <main class="flex justify-center items-center min-h-screen">
      <!-- Modal window -->
      <div
        class="relative overflow-hidden flex rounded-xl shadow-lg shadow-black/10 bg-white"
      >
        <div
          class="absolute top-4 right-4 flex justify-center items-center transition duration-200 p-2 rounded-full bg-gray-200 lg:bg-white hover:bg-gray-300 cursor-pointer hover:-translate-y-0.5"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            class="w-6 h-6"
          >
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </div>
        <!-- Left side -->
        <div class="p-6 lg:p-20">
          <!-- Modal header -->
          <header class="mb-8">
            <h1 class="mb-6 text-4xl font-bold font-serif">Log in</h1>
            <p class="max-w-sm font-light text-gray-600">
              Log in to your account to upload or download pictures, videos or
              music.
            </p>
          </header>

          <!-- Modal form -->
          <form action="#" class="border-b border-gray-300 mb-6 pb-12">
            <!-- Email field -->
            <div class="mb-6">
              <label for="email" class="sr-only"
                >Enter your email address</label
              >
              <input
                type="email"
                name="email"
                id="email"
                placeholder="Enter your email address"
                class="w-full p-6 border rounded-lg border-gray-300 placeholder:text-gray-400 font-light focus:outline-none"
              />
            </div>

            <!-- Forgot and button -->
            <div
              class="flex flex-col lg:flex-row lg:justify-between text-center"
            >
              <a href="#" class="inline-block my-6 text-cyan-700 font-light"
                >Forgot password</a
              >
              <button
                type="button"
                class="flex w-full lg:w-auto text-center gap-3 justify-center items-center transition duration-300 p-6 rounded-lg bg-cyan-700 cursor-pointer text-white font-bold hover:shadow-lg hover:shadow-black/20 hover:-translate-y-1"
              >
                <span>Next</span
                ><svg
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="w-5 h-5"
                >
                  <path d="M5 12h14M13 5l6 7-6 7" />
                </svg>
              </button>
            </div>
          </form>

          <!-- Modal footer -->
          <footer class="flex flex-col gap-6 text-center">
            <p class="text-sm font-light text-gray-400">or log in with</p>

            <div class="flex flex-col lg:flex-row gap-6">
              <button
                type="button"
                class="flex items-center justify-center gap-4 transition duration-200 w-full rounded-md border border-gray-300 py-2 cursor-pointer hover:shadow-md hover:shadow-black/10 hover:-translate-y-1"
              >
                <img
                  src="./images/facebook.png"
                  alt="Facebook"
                  class="w-10 aspect-square"
                /><span>Facebook</span>
              </button>
              <button
                type="button"
                class="flex items-center justify-center gap-4 transition duration-200 w-full rounded-md border border-gray-300 py-2 cursor-pointer hover:shadow-md hover:shadow-black/10 hover:-translate-y-1"
              >
                <img
                  src="./images/google.png"
                  alt="Google"
                  class="w-10 aspect-square"
                /><span>Google</span>
              </button>
            </div>
          </footer>
        </div>

        <!-- Right side -->
        <div class="hidden lg:block max-w-md">
          <img src="./images/image.jpg" alt="" />
        </div>
      </div>
    </main>
  </body>
</html>

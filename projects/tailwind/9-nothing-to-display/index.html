<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="./dist/output.css" />
    <title>Tailwind CSS</title>
  </head>
  <body class="bg-slate-900 text-white">
    <main>
      <section
        class="flex flex-col items-center mx-auto max-w-md pt-10 text-center"
      >
        <header class="flex flex-col items-center gap-y-4 mb-6">
          <div
            class="flex justify-center items-center w-14 h-14 border-2 border-gray-500 rounded-full text-3xl"
          >
            ✖
          </div>
          <h2 class="text-2xl font-semibold">Nothing to display</h2>
        </header>

        <section>
          <p class="mb-6 text-gray-400">
            We couldn't find any data to show here. Try refining your search or
            come back later to see if there's anything new.
          </p>
          <button
            type="button"
            class="inline-block transition-colors duration-200 rounded px-6 py-3 bg-purple-500 hover:bg-purple-600 cursor-pointer"
          >
            Reset filters
          </button>
        </section>
      </section>
    </main>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="./dist/output.css" />
    <title>Tailwind CSS</title>
  </head>
  <body class="min-h-screen bg-gray-100 p-8 dark:bg-gray-900">
    <label
      class="inline-flex items-center me-5 cursor-pointer mb-6 p-3 bg-white border border-gray-300 rounded-lg dark:bg-gray-700 dark:text-white"
    >
      <input
        type="checkbox"
        value=""
        class="sr-only peer"
        name="darkModeSwitch"
        id="darkModeSwitch"
      />
      <div
        class="relative w-9 h-5 bg-gray-300 rounded-full peer dark:bg-gray-700 peer-focus:ring-4 peer-focus:ring-purple-300 dark:peer-focus:ring-purple-800 peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-0.5 after:inset-s-0.5 after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-purple-600 dark:peer-checked:bg-purple-600"
      ></div>
      <span class="select-none ms-3 text-sm font-medium text-heading"
        >Toggle Dark Mode</span
      >
    </label>

    <main>
      <section
        class="p-8 max-w-lg mx-auto rounded shadow-xl dark:shadow-lg dark:shadow-purple-500 bg-white dark:bg-gray-800"
      >
        <!-- Login header -->
        <header class="text-center">
          <span class="block mb-6 text-6xl uppercase text-purple-500">u</span>
          <h1 class="mb-3 text-2xl font-bold dark:text-white">
            Log In or create account
          </h1>
          <p class="text-gray-500 dark:text-gray-400">
            Welcome to Udemy, powered by Good Code
          </p>
        </header>

        <!-- Login fields -->
        <form action="#" class="flex flex-col gap-y-6 py-8">
          <!-- Form group -->
          <div class="flex flex-col gap-y-2">
            <label for="email" class="sr-only">Enter email</label>
            <input
              type="email"
              name="email"
              id="email"
              placeholder="user@goodcode.us"
              class="px-4 py-3 border border-gray-700 rounded outline-none dark:bg-gray-800 dark:text-gray-100"
            />
          </div>

          <button
            type="button"
            class="transition duration-200 py-3 rounded-lg bg-purple-500 hover:bg-purple-600 cursor-pointer text-white"
          >
            Login
          </button>

          <button
            type="button"
            class="hover:transition hover:duration-200 py-3 border border-gray-300 bg-gray-100 hover:bg-gray-200 dark:bg-gray-800 dark:hover:bg-gray-700 cursor-pointer text-gray-900 dark:text-white"
          >
            Sign up with Google
          </button>
        </form>

        <footer>
          <p class="text-center dark:text-gray-300">
            By signing in, you agree to our
            <a href="#" class="underline text-purple-500">terms of service</a>
            and
            <a href="#" class="underline text-purple-500">privacy policy</a>.
          </p>
        </footer>
      </section>
    </main>
    <script src="./src/main.js"></script>
  </body>
</html>
